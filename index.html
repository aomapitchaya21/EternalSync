<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EternalSync | For You</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0d1117; /* สีเข้มแบบ GitHub */
            color: #58a6ff;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
        }
        .container {
            border: 1px solid #30363d;
            padding: 2rem;
            border-radius: 10px;
            background: #161b22;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 { font-size: 1.5rem; margin-bottom: 1rem; }
        p { color: #8b949e; line-height: 1.6; }
        .heart { color: #f85149; font-size: 2rem; animation: pulse 1s infinite; }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            color: #aff5b4;
            border: 1px solid #3fb950;
            text-decoration: none;
            border-radius: 5px;
            transition: 0.3s;
        }
        .btn:hover { background: #238636; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="heart">❤</div>
        <h1>System.init("EternalSync");</h1>
        <p>> Connection established...<br>
           > Happiness synced successfully.<br>
           > I love you more than all the code in this world.</p>
        <a href="#" class="btn">Click to decrypt my heart</a>
    </div>
</body>
</html>
